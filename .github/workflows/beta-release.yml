name: Beta Release

on:
  push:
    branches:
      - 'claude/**'
      - 'work'

jobs:
  beta-release:
    name: Publish beta pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/unipolsai/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine next beta number
        id: beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Cerca tutti i tag beta esistenti per questa versione
          LAST=$(gh release list --limit 100 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v${VERSION}-beta.\"))] | \
                  map(ltrimstr(\"v${VERSION}-beta.\") | tonumber) | \
                  max // 0" 2>/dev/null || echo "0")
          NEXT=$((LAST + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-beta.${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Create beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.beta.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BETA_N="${{ steps.beta.outputs.number }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"

          gh release create "$TAG" \
            --title "v${VERSION} beta ${BETA_N}" \
            --notes "**Pre-release automatica** dal branch \`${BRANCH}\` (commit \`${SHORT}\`)

          > Questa è una versione beta non adatta alla produzione.
          > Per installarla tramite HACS abilita le release di pre-produzione.

          **Versione base:** \`${VERSION}\`
          **Beta numero:** \`${BETA_N}\`
          **Commit:** [\`${SHORT}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT})" \
            --prerelease \
            --target "$BRANCH"
